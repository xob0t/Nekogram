name: Release Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Skip Upload: Set to "y" to skip uploading the build.'
        required: false

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    outputs:
      build_timestamp: ${{ steps.release_build_step.outputs.build_timestamp }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          append-timestamp: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle') }}

      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;36.1.0 ndk;27.3.13750724 platforms;android-36"

      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties

      - name: Configure Firebase
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          : "${GOOGLE_SERVICES_JSON_B64:?GOOGLE_SERVICES_JSON_B64 secret is required}"
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > TMessagesProj/google-services.json

      - name: Configure release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          : "${RELEASE_KEYSTORE_B64:?RELEASE_KEYSTORE_B64 secret is required}"
          mkdir -p TMessagesProj/config
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > TMessagesProj/config/release.keystore

      - name: Configure signing
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          : "${LOCAL_PROPERTIES:?LOCAL_PROPERTIES secret is required}"
          printf '%s\n' "$LOCAL_PROPERTIES" >> local.properties

      - name: Configure Telegram API credentials
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          : "${APP_ID:?APP_ID secret is required}"
          : "${APP_HASH:?APP_HASH secret is required}"
          perl -0pi -e 's/public static final int APP_ID = \d+;/public static final int APP_ID = $ENV{APP_ID};/; s/public static final String APP_HASH = ".*?";/public static final String APP_HASH = "$ENV{APP_HASH}";/' TMessagesProj/src/main/java/tw/nekomimi/nekogram/Extra.java

      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties

      - name: Release Build
        id: release_build_step
        env:
          COMMIT_ID: ${{ github.event.head_commit.id }}
        run: |
          export BUILD_TIMESTAMP=$(date +%s)
          echo "build_timestamp=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
          ./gradlew :TMessagesProj_App:assembleRelease

          ARM64_APK=TMessagesProj_App/build/outputs/apk/ci-release-arm64-v8a
          UNIVERSAL_APK=TMessagesProj_App/build/outputs/apk/ci-release-universal
          mkdir -p "$ARM64_APK" "$UNIVERSAL_APK"
          cp TMessagesProj_App/build/outputs/apk/release/*arm64-v8a.apk "$ARM64_APK"/
          cp TMessagesProj_App/build/outputs/apk/release/*universal.apk "$UNIVERSAL_APK"/
          echo "ARM64_APK=$ARM64_APK" >> "$GITHUB_ENV"
          echo "UNIVERSAL_APK=$UNIVERSAL_APK" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Release-arm64-v8a
          path: ${{ env.ARM64_APK }}

      - uses: actions/upload-artifact@v4
        with:
          name: Release-universal
          path: ${{ env.UNIVERSAL_APK }}

  upload:
    name: Upload release
    if: github.event.inputs.upload != 'y' && !contains(github.event.head_commit.message || '', '[skip upload]')
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Send to Telegram
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          COMMIT_ID: ${{ github.event.head_commit.id || github.sha }}
          COMMIT_URL: ${{ github.event.head_commit.url || format('{0}/{1}/commit/{2}', github.server_url, github.repository, github.sha) }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.sha }}
          BUILD_TIMESTAMP: ${{ needs.build.outputs.build_timestamp }}
        run: |
          find artifacts -name "*.apk" | sort
          python -m pip install -r Tools/scripts/requirements.txt
          python Tools/scripts/upload.py ${{ secrets.HELPER_BOT_TOKEN }} ${{ secrets.HELPER_BOT_TARGET }} ${{ secrets.HELPER_BOT_CANARY_TARGET }}
